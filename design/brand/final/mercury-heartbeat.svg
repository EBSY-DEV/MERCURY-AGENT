<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img">
  <title>Mercury Agent is running</title>
  <style>
    .ink { fill: var(--accent, #6D53D3); }
    @media (prefers-color-scheme: dark) { .ink { fill: var(--accent, #B7A4F7); } }
    .mv { transform-box: fill-box; transform-origin: center; animation: 2.4s infinite both; }
    .dot { animation-name: am-dot; }
    .bite { animation-name: am-bite; }
    @keyframes am-dot {
      0%   { transform: translateX(-54.98px) scale(0); animation-timing-function: cubic-bezier(.33,1,.68,1); }
      12%  { transform: translateX(-54.98px) scale(1); animation-timing-function: cubic-bezier(.16,1,.3,1); }
      58%  { transform: translateX(0) scale(1); }
      88%  { transform: translateX(0) scale(1); animation-timing-function: cubic-bezier(.5,0,.75,0); }
      100% { transform: translateX(9.82px) scale(0); }
    }
    @keyframes am-bite {
      0%   { transform: translateX(-54.98px) scale(0); animation-timing-function: cubic-bezier(.33,1,.68,1); }
      12%  { transform: translateX(-54.98px) scale(1); animation-timing-function: cubic-bezier(.16,1,.3,1); }
      58%  { transform: translateX(0) scale(1); }
      88%  { transform: translateX(0) scale(1); animation-timing-function: cubic-bezier(.5,0,.75,0); }
      100% { transform: translateX(9.82px) scale(0); }
    }
    @media (prefers-reduced-motion: reduce) { .mv { animation: none; } }
  </style>
  <mask id="am-bite-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
    <rect width="256" height="256" fill="#000"/>
    <circle cx="122.18" cy="128" r="98.18" fill="#FFF"/>
    <circle class="mv bite" cx="200.73" cy="128" r="58.91" fill="#000"/>
  </mask>
  <circle class="ink" cx="122.18" cy="128" r="98.18" mask="url(#am-bite-mask)"/>
  <circle class="ink mv dot" cx="200.73" cy="128" r="39.27"/>
</svg>
