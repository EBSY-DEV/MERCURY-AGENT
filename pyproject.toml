[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mercury-agent"
version = "0.2.0"
description = "Mercury Agent: an autonomous outreach agent that runs on your Claude subscription."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "EBSY" }]
keywords = ["sales", "ai-agent", "cold-email", "prospecting", "autonomous-agent", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
# Keep in sync with requirements.txt (used by Docker builds).
dependencies = [
    "pyyaml>=6.0.1,<7",
    "python-dotenv>=1.0.1,<2",
    "httpx>=0.27.0,<1",
    "playwright>=1.40,<2",
    "beautifulsoup4>=4.12.3,<5",
    "dnspython>=2.4.2,<3",
    "aiosmtplib>=3.0.1,<4",
    "aiosqlite>=0.19,<1",
    "pydantic>=2.5,<3",
    "pytz>=2024.1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
]

[project.urls]
Homepage = "https://github.com/EBSY-DEV/MERCURY-AGENT"
Issues = "https://github.com/EBSY-DEV/MERCURY-AGENT/issues"
Changelog = "https://github.com/EBSY-DEV/MERCURY-AGENT/blob/main/CHANGELOG.md"

[project.scripts]
mercury = "mercury.cli:main"
# Deprecated alias from before the Harvey -> Mercury rename. Deployed systemd
# units still run `.venv/bin/harvey run` / `harvey dashboard`; keep this until
# they are switched to `mercury`.
harvey = "mercury.cli:main"

[tool.setuptools.packages.find]
include = ["mercury*"]

# The dashboard's HTML/CSS/JS are real files served from disk, and its fonts
# are vendored so a local tool renders correctly with the network off.
[tool.setuptools.package-data]
mercury = ["web/*", "web/fonts/*", "web/avatars/*"]
