name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Import smoke test
        run: python -c "import mercury.dashboard, mercury.control.personas, mercury.cli"
      - name: Check packaged dashboard assets
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python scripts/check_wheel_assets.py dist/*.whl
      - name: Test
        run: python -m pytest -q
